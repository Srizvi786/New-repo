name: validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Headless import (fails on broken scenes/scripts)
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import
          echo "import-exit=$?"

      - name: GDScript headless checks
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --check-only --script res://scripts/validate_project.gd || true
          python3 scripts/validate_project.py

      - name: Structure tests
        run: |
          pip install pytest
          python3 -m pytest tests/ -q
