name: android-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Godot 4.7.2 + export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/tpl.tpz
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Validate project
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import
          python3 scripts/validate_project.py
          pip install pytest && python3 -m pytest tests/ -q

      - name: Export debug APK (free runner, no signing key needed)
        run: |
          mkdir -p build
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/dustline-debug.apk
          ls -lh build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dustline-debug-apk
          path: build/dustline-debug.apk
